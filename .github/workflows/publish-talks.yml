name: Publish talk assets

on:
  push:
    branches: [main]
    paths:
      - "talks/**"
      - "talks.json"
      - "scripts/build_published.py"
      - ".github/workflows/publish-talks.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-talk-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build optimized HTML decks
        run: python scripts/build_published.py
      - name: Commit published assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A published/
          if ! git diff --cached --quiet; then
            git commit -m "Publish optimized talk assets [skip ci]"
            git push
          fi
