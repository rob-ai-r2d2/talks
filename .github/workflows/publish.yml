name: Publish talks to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "talks/**"
      - "talks.json"
      - "scripts/build_site.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talks-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate static assets
        run: python3 scripts/build_site.py
      - name: Publish to Cloudflare Pages
        if: env.DEPLOY_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d166cad2744036d170b826f2dfbbf20e
        run: npx --yes wrangler@4 pages deploy dist --project-name=aikis-talks --branch=main
      - name: Explain missing credentials
        if: env.DEPLOY_TOKEN == ''
        run: |
          echo "::notice::Build complete. Add the CLOUDFLARE_API_TOKEN repository secret to activate deployment."
